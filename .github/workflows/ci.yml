name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  backend:
    name: Backend Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tester le backend
        run: mvn -B test

  mobile:
    name: Mobile Flutter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 17 pour Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installer les dependances Flutter
        run: flutter pub get

      - name: Analyser le code mobile
        run: flutter analyze

      - name: Tester le mobile
        run: flutter test

      - name: Verifier le build APK debug
        run: flutter build apk --debug --dart-define=MIAMAI_API_BASE=http://127.0.0.1:8080/api

      - name: Publier l'APK debug
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: miamai-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
