name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      api_base:
        description: "URL de l'API compilee dans l'APK"
        required: false
        default: "http://10.0.2.2:8080/api"

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  DEFAULT_API_BASE: "http://10.0.2.2:8080/api"

jobs:
  build-artifacts:
    name: Construire les artefacts
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Construire le backend
        working-directory: backend
        run: mvn -B package

      - name: Installer Java 17 pour Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Choisir l'URL API de l'APK
        id: api
        shell: bash
        env:
          INPUT_API_BASE: ${{ inputs.api_base }}
          REPO_API_BASE: ${{ vars.MIAMAI_API_BASE }}
        run: |
          if [ -n "$INPUT_API_BASE" ]; then
            echo "value=$INPUT_API_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$REPO_API_BASE" ]; then
            echo "value=$REPO_API_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DEFAULT_API_BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparer la signature Android release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MIAMAI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIAMAI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIAMAI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIAMAI_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets Android manquants. Configure MIAMAI_ANDROID_KEYSTORE_BASE64, MIAMAI_ANDROID_KEYSTORE_PASSWORD, MIAMAI_ANDROID_KEY_ALIAS et MIAMAI_ANDROID_KEY_PASSWORD."
            exit 1
          fi

          mkdir -p mobile/android/app/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/signing/miamai-release.jks

          echo "MIAMAI_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/mobile/android/app/signing/miamai-release.jks" >> "$GITHUB_ENV"
          echo "MIAMAI_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MIAMAI_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MIAMAI_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Installer les dependances Flutter
        working-directory: mobile
        run: flutter pub get

      - name: Construire l'APK Android
        working-directory: mobile
        env:
          API_BASE: ${{ steps.api.outputs.value }}
        run: flutter build apk --release --dart-define=MIAMAI_API_BASE="$API_BASE"

      - name: Verifier la signature Android
        shell: bash
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Preparer les artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp backend/target/miamai-api-*.jar dist/miamai-api.jar
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/miamai-android.apk

      - name: Publier les artefacts
        uses: actions/upload-artifact@v6
        with:
          name: miamai-build
          path: dist/*
          retention-days: 30

      - name: Creer ou mettre a jour la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Artefacts MiamAI generes automatiquement par GitHub Actions."
          fi
